<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>F&G System Health Dashboard — OQGN</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ══ DESIGN TOKENS — DARK ═══════════════════════════════════════════ */
[data-theme="dark"] {
  --bg:        #06080f;
  --s1:        #0a0d17;
  --s2:        #0e1220;
  --s3:        #121828;
  --s4:        #182030;
  --border:    #1a2436;
  --border2:   #223048;
  --border3:   #2a3c55;
  --text:      #e2e8f4;
  --text2:     #94a3b8;
  --text3:     #4a6080;
  --text4:     #2a3a52;
  --shadow:    rgba(0,0,0,.55);
  --tbbg:      rgba(6,8,15,.94);
  --grid-line: rgba(255,255,255,.018);
  --glow1:     rgba(0,229,160,.045);
  --glow2:     rgba(96,165,250,.035);
  --glow3:     rgba(239,68,68,.02);
  --mode-ico:  "☀️";
  --mode-lbl:  "Light Mode";
}

/* ══ DESIGN TOKENS — LIGHT ══════════════════════════════════════════ */
[data-theme="light"] {
  --bg:        #f0f4f8;
  --s1:        #ffffff;
  --s2:        #f8fafc;
  --s3:        #f1f5f9;
  --s4:        #e2e8f0;
  --border:    #e2e8f0;
  --border2:   #cbd5e1;
  --border3:   #94a3b8;
  --text:      #0f172a;
  --text2:     #334155;
  --text3:     #64748b;
  --text4:     #94a3b8;
  --shadow:    rgba(0,0,0,.10);
  --tbbg:      rgba(255,255,255,.96);
  --grid-line: rgba(0,0,0,.04);
  --glow1:     rgba(0,180,120,.06);
  --glow2:     rgba(59,130,246,.05);
  --glow3:     rgba(239,68,68,.03);
  --mode-ico:  "🌙";
  --mode-lbl:  "Dark Mode";
}

/* ══ SHARED TOKENS (same in both themes) ════════════════════════════ */
:root {
  --green:     #00e5a0;
  --green-b:   #00b87a;
  --green-glow:rgba(0,229,160,.18);
  --green-dim: rgba(0,229,160,.07);
  --green-mid: rgba(0,229,160,.12);
  --amber:     #f59e0b;
  --amber-dim: rgba(245,158,11,.07);
  --amber-mid: rgba(245,158,11,.14);
  --red:       #ef4444;
  --red-dim:   rgba(239,68,68,.07);
  --red-mid:   rgba(239,68,68,.14);
  --blue:      #60a5fa;
  --blue-dim:  rgba(96,165,250,.07);
  --blue-mid:  rgba(96,165,250,.13);
  --font-head: 'Rajdhani', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-sm: 8px;
  --radius:    12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
}

/* ══ RESET & BASE ═══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background .3s, color .3s;
}

/* ══ BACKGROUND GLOWS ═══════════════════════════════════════════════ */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 55% 30% at 15% 0%,   var(--glow1) 0%, transparent 60%),
    radial-gradient(ellipse 40% 25% at 85% 100%, var(--glow2) 0%, transparent 60%),
    radial-gradient(ellipse 30% 20% at 70% 30%,  var(--glow3) 0%, transparent 50%);
  pointer-events: none;
  transition: background .3s;
}
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}
#app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

/* ══ TOPBAR ══════════════════════════════════════════════════════════ */
.topbar {
  position: sticky; top: 0; z-index: 300;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  padding: 0 28px;
  height: 62px;
  background: var(--tbbg);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  transition: background .3s, border-color .3s;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-icon {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--green), var(--green-b));
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  box-shadow: 0 0 0 1px rgba(0,229,160,.35), 0 4px 20px rgba(0,229,160,.2);
}
.brand-name {
  font-family: var(--font-head);
  font-size: 20px; font-weight: 700; letter-spacing: .06em; color: var(--text);
  line-height: 1; transition: color .3s;
}
.brand-name em {
  display: block; font-family: var(--font-mono); font-style: normal;
  font-size: 9px; font-weight: 400;
  color: var(--green); letter-spacing: .22em; text-transform: uppercase; margin-top: 3px;
}
.topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ══ THEME TOGGLE BUTTON ════════════════════════════════════════════ */
.btn-theme {
  cursor: pointer;
  background: var(--s2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 7px 13px;
  font-size: 12px; font-weight: 600;
  font-family: var(--font-body);
  color: var(--text2);
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .2s; white-space: nowrap;
}
.btn-theme:hover { border-color: var(--green); color: var(--green); background: var(--green-dim); }
[data-theme="light"] .theme-dark-label { display: inline; }
[data-theme="light"] .theme-light-label { display: none; }
[data-theme="dark"]  .theme-dark-label { display: none; }
[data-theme="dark"]  .theme-light-label { display: inline; }

/* ══ BUTTONS ═════════════════════════════════════════════════════════ */
.btn {
  cursor: pointer; border: none;
  font-family: var(--font-body); font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px;
  white-space: nowrap; letter-spacing: .01em;
  transition: all .18s cubic-bezier(.4,0,.2,1);
  position: relative; overflow: hidden;
}
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(rgba(255,255,255,.08), transparent);
  opacity: 0; transition: opacity .18s;
}
.btn:hover::after { opacity: 1; }
.btn:active { transform: scale(.96); }

.btn-primary {
  background: linear-gradient(135deg, var(--green), var(--green-b));
  color: #041a0e; border-radius: var(--radius-sm);
  padding: 8px 18px; font-size: 13px;
  box-shadow: 0 0 0 1px rgba(0,229,160,.3), 0 4px 16px rgba(0,229,160,.18);
}
.btn-primary:hover { filter: brightness(1.08); box-shadow: 0 0 0 1px rgba(0,229,160,.5), 0 6px 24px rgba(0,229,160,.28); }

.btn-ghost {
  background: var(--s2); color: var(--text2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 7px 14px; font-size: 12px; transition: all .18s;
}
.btn-ghost:hover { border-color: var(--border2); color: var(--text); }

.btn-save {
  background: linear-gradient(135deg, #d97706, var(--amber));
  color: #1a0e00; border-radius: var(--radius-sm);
  padding: 8px 18px; font-size: 13px; font-weight: 700;
  box-shadow: 0 0 0 1px rgba(245,158,11,.35), 0 4px 16px rgba(245,158,11,.18);
}
.btn-save:hover { filter: brightness(1.08); box-shadow: 0 0 0 1px rgba(245,158,11,.55), 0 6px 24px rgba(245,158,11,.28); }

.btn-load {
  background: linear-gradient(135deg, #2563eb, var(--blue));
  color: #00051a; border-radius: var(--radius-sm);
  padding: 8px 18px; font-size: 13px; font-weight: 700;
  box-shadow: 0 0 0 1px rgba(96,165,250,.35), 0 4px 16px rgba(96,165,250,.18);
}
.btn-load:hover { filter: brightness(1.08); box-shadow: 0 0 0 1px rgba(96,165,250,.55), 0 6px 24px rgba(96,165,250,.28); }

.btn-icon {
  background: var(--s2); color: var(--text2);
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 7px 12px; font-size: 13px; transition: all .18s;
}
.btn-icon:hover { border-color: var(--border3); color: var(--text); }

/* Card micro buttons */
.mbtn {
  cursor: pointer; border: 1px solid; border-radius: 7px;
  padding: 4px 11px; font-size: 11px; font-weight: 600;
  font-family: var(--font-mono); letter-spacing: .04em;
  display: inline-flex; align-items: center; gap: 5px;
  transition: all .15s; background: transparent;
}
.mbtn-cl  { color: var(--blue);  border-color: rgba(96,165,250,.25); }
.mbtn-cl:hover  { background: var(--blue-mid); border-color: rgba(96,165,250,.5); }
.mbtn-ed  { color: var(--green); border-color: rgba(0,229,160,.25); }
.mbtn-ed:hover  { background: var(--green-mid); border-color: rgba(0,229,160,.5); }
.mbtn-del { color: var(--red);   border-color: rgba(239,68,68,.25); }
.mbtn-del:hover { background: var(--red-mid); border-color: rgba(239,68,68,.5); }
.mbtn-up  { color: var(--green); border-color: rgba(0,229,160,.25); }
.mbtn-up:hover  { background: var(--green-mid); }
.mbtn-dl  { color: var(--blue);  border-color: rgba(96,165,250,.25); }
.mbtn-dl:hover  { background: var(--blue-mid); }

.rbtn {
  cursor: pointer; border: 1px solid; border-radius: 6px;
  padding: 3px 10px; font-size: 10px; font-weight: 700;
  font-family: var(--font-mono); transition: all .12s; background: transparent;
}

/* ══ INPUTS ══════════════════════════════════════════════════════════ */
.inp {
  background: var(--s2); color: var(--text);
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 8px 12px; font-size: 13px; font-family: var(--font-body);
  width: 100%; outline: none; transition: border .18s, box-shadow .18s, background .3s, color .3s;
}
.inp:focus { border-color: rgba(0,229,160,.45); box-shadow: 0 0 0 3px rgba(0,229,160,.08); }
.sel {
  background: var(--s2); color: var(--text);
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 8px 10px; font-size: 13px; font-family: var(--font-body);
  cursor: pointer; outline: none; transition: background .3s, color .3s;
}
.sel:focus { border-color: rgba(0,229,160,.4); }
input[type=date]::-webkit-calendar-picker-indicator { filter: invert(.5) sepia(1) hue-rotate(90deg) brightness(1.2); }

/* ══ SYNC BAR ════════════════════════════════════════════════════════ */
.syncbar {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
  padding: 9px 28px;
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  font-size: 11px; font-family: var(--font-mono);
  color: var(--text3);
  transition: background .3s, border-color .3s;
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: inline-block; margin-right: 7px; }
.dot-ok   { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot-busy { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: blink 1.1s infinite; }
.dot-err  { background: var(--red);   box-shadow: 0 0 8px var(--red); }
.syncbar-hint { color: var(--text3); font-size: 11px; }
.syncbar-hint strong { color: var(--amber); font-weight: 600; }

/* ══ MAIN ════════════════════════════════════════════════════════════ */
.main { padding: 26px 28px 70px; }

/* ══ KPI ROW ══════════════════════════════════════════════════════════ */
.kpi-row { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
.kpi {
  flex: 1; min-width: 100px;
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px 20px;
  position: relative; overflow: hidden;
  transition: transform .22s, border-color .22s, background .3s;
}
.kpi:hover { transform: translateY(-3px); border-color: var(--border2); }
.kpi-top-bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.kpi-icon { font-size: 22px; margin-bottom: 10px; display: block; }
.kpi-val { font-family: var(--font-head); font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -.01em; }
.kpi-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .14em; margin-top: 5px; font-family: var(--font-mono); }
.kpi-sub { font-size: 11px; font-weight: 600; margin-top: 4px; }
.kpi-corner { position: absolute; right: -20px; bottom: -20px; width: 80px; height: 80px; border-radius: 50%; opacity: .05; }

/* ══ CONTROLS ════════════════════════════════════════════════════════ */
.controls { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.tab-wrap { display: flex; border: 1px solid var(--border2); border-radius: var(--radius-sm); overflow: hidden; }
.tab-btn { padding: 7px 16px; font-size: 12px; font-weight: 600; font-family: var(--font-body); cursor: pointer; border: none; transition: all .15s; letter-spacing: .02em; }

/* ══ STATION GRID ════════════════════════════════════════════════════ */
.st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }

/* ══ STATION CARD ════════════════════════════════════════════════════ */
.st-card {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
  position: relative; overflow: hidden;
  transition: transform .22s cubic-bezier(.4,0,.2,1), box-shadow .22s, border-color .22s, background .3s;
}
.st-card:hover { transform: translateY(-3px); box-shadow: 0 16px 48px var(--shadow); }
.st-accent { position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.st-glow   { position: absolute; top: 0; left: 0; right: 0; height: 70px; opacity: .05; pointer-events: none; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.st-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 13px; }
.st-name { font-family: var(--font-head); font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; line-height: 1.2; }
.st-zone { font-size: 10px; color: var(--text3); font-family: var(--font-mono); letter-spacing: .1em; text-transform: uppercase; }
.h-chip { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 4px 10px; border-radius: 20px; flex-shrink: 0; font-family: var(--font-mono); border: 1px solid; }
.h-pip  { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

/* ══ STATUS TRIO ═════════════════════════════════════════════════════ */
.trio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-bottom: 11px; }
.trio-cell { background: var(--s2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 4px; text-align: center; transition: background .3s; }
.trio-lbl  { font-size: 8px; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; font-family: var(--font-mono); margin-bottom: 5px; }
.badge     { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .06em; font-family: var(--font-mono); border: 1px solid; }

/* ══ DATE GRID ═══════════════════════════════════════════════════════ */
.date-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 9px; }
.date-item { font-size: 11px; color: var(--text3); }
.date-item span { color: var(--text); font-weight: 500; display: block; margin-top: 1px; }

/* ══ NOTE ════════════════════════════════════════════════════════════ */
.note-tag { font-size: 11px; color: var(--amber); background: var(--amber-dim); border: 1px solid rgba(245,158,11,.18); border-radius: var(--radius-sm); padding: 6px 10px; margin-bottom: 9px; line-height: 1.5; }

/* ══ CL STRIP ════════════════════════════════════════════════════════ */
.cl-strip { background: var(--s2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 10px; transition: background .3s; }
.cl-strip-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.cl-date { font-size: 12px; color: var(--text); font-weight: 600; font-family: var(--font-mono); }
.cl-tech { font-size: 10px; color: var(--text3); margin-top: 2px; }
.cl-badges { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
.cl-badge { font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 8px; font-family: var(--font-mono); border: 1px solid; }
.issue-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.issue-pill { font-size: 9px; color: #ffaaaa; font-family: var(--font-mono); background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.18); border-radius: 4px; padding: 2px 7px; max-width: 155px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-actions { display: flex; gap: 6px; }

/* ══ TABLE ═══════════════════════════════════════════════════════════ */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--s1); transition: background .3s; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead tr { background: var(--s2); border-bottom: 1px solid var(--border2); }
th { padding: 11px 12px; text-align: left; color: var(--text3); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; white-space: nowrap; font-family: var(--font-mono); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(128,128,128,.04); }

/* ══ ADD CARD ════════════════════════════════════════════════════════ */
.add-card { background: var(--s1); border: 1px solid rgba(0,229,160,.2); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 18px; box-shadow: 0 0 30px rgba(0,229,160,.04); }

/* ══ FORM ════════════════════════════════════════════════════════════ */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-full { grid-column: 1/-1; }
.form-lbl  { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 5px; font-weight: 600; font-family: var(--font-mono); }

/* ══ MODAL ═══════════════════════════════════════════════════════════ */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.78);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal { background: var(--s1); border: 1px solid var(--border2); border-radius: var(--radius-xl); width: 100%; max-width: 740px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 32px 96px var(--shadow); }
.modal-hdr { padding: 16px 22px; border-bottom: 1px solid var(--border); background: var(--s2); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.modal-title { font-family: var(--font-head); font-size: 17px; font-weight: 700; color: var(--text); }
.modal-sub   { font-size: 11px; color: var(--green); margin-top: 2px; font-family: var(--font-mono); }
.modal-body  { overflow-y: auto; flex: 1; padding: 22px; background: var(--s1); }

/* ══ HISTORY ROW ═════════════════════════════════════════════════════ */
.hist-row { background: var(--s2); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 16px; margin-bottom: 9px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: border-color .18s, background .18s; }
.hist-row:hover { border-color: rgba(0,229,160,.22); background: var(--s3); }
.hist-row.bad   { border-color: rgba(239,68,68,.2); }
.hist-row.bad:hover { border-color: rgba(239,68,68,.4); }

/* ══ CL ITEM ═════════════════════════════════════════════════════════ */
.cl-item { background: var(--s2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; margin-bottom: 7px; transition: border-color .15s, background .3s; }
.cl-item.is-fail { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.03); }
.cl-item-row { display: flex; align-items: center; gap: 10px; }
.cl-item-lbl { font-size: 12px; color: var(--text); flex: 1; line-height: 1.4; }

/* ══ CATEGORY HEADER IN CHECKLIST ═══════════════════════════════════ */
.cl-cat-hdr {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .14em;
  color: var(--green); background: var(--green-dim);
  border: 1px solid rgba(0,229,160,.18);
  border-radius: var(--radius-sm); padding: 6px 12px;
  margin: 14px 0 8px; display: flex; align-items: center; gap: 7px;
}

/* ══ DOC ROW ═════════════════════════════════════════════════════════ */
.doc-row { display: flex; align-items: center; gap: 12px; background: var(--s2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 8px; transition: background .3s; }
.doc-info { flex: 1; min-width: 0; }
.doc-name { font-size: 12px; color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-meta { font-size: 10px; color: var(--text3); margin-top: 2px; font-family: var(--font-mono); }

/* ══ SECTION LABEL ═══════════════════════════════════════════════════ */
.sect-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .14em; font-weight: 600; margin-bottom: 10px; font-family: var(--font-mono); }

/* ══ LEGEND ══════════════════════════════════════════════════════════ */
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 10px; color: var(--text3); align-items: center; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border); font-family: var(--font-mono); }

/* ══ EMPTY ═══════════════════════════════════════════════════════════ */
.empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-ico { font-size: 46px; margin-bottom: 14px; display: block; opacity: .4; }

/* ══ TOAST ═══════════════════════════════════════════════════════════ */
#toast { position: fixed; bottom: 24px; right: 24px; padding: 11px 20px; border-radius: var(--radius); font-weight: 600; font-size: 13px; z-index: 9999; display: none; box-shadow: 0 10px 32px rgba(0,0,0,.6); backdrop-filter: blur(10px); font-family: var(--font-body); letter-spacing: .01em; }

/* ══ ANIMATIONS ══════════════════════════════════════════════════════ */
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@keyframes blink  { 0%,100%{opacity:1} 50%{opacity:.25} }
@keyframes spin   { to { transform:rotate(360deg); } }
.fu   { animation: fadeUp .3s ease both; }
.spin { display:inline-block; animation:spin .75s linear infinite; }

/* ══ SCROLLBAR ═══════════════════════════════════════════════════════ */
::-webkit-scrollbar       { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--s1); }
::-webkit-scrollbar-thumb { background:var(--s4); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--text3); }

}

// ══════════════════════════════════════════════════════════════════════
//  HEALTH LOGIC
// ══════════════════════════════════════════════════════════════════════
const T0 = new Date().setHours(0,0,0,0);
function dLeft(d){ if(!d) return null; return Math.ceil((new Date(d)-T0)/86400000); }
function hlth(s){
  if(s.det==="Offline"||s.pwr==="Fault") return "Critical";
  if(s.det==="Fault"||s.bat==="Low"||s.pwr==="Low") return "Warning";
  const d=dLeft(s.nextTest); if(d!==null&&d<14) return "Warning";
  return "Healthy";
}
const HX = { Healthy:"#00e5a0", Warning:"#f59e0b", Critical:"#ef4444" };
const SC = {
  OK:     { c:"var(--green)", x:"#00e5a0", bg:"rgba(0,229,160,.1)" },
  Fault:  { c:"var(--red)",   x:"#ef4444", bg:"rgba(239,68,68,.1)" },
  Offline:{ c:"var(--text3)", x:"#4a6080", bg:"rgba(74,96,128,.1)" },
  Low:    { c:"var(--amber)", x:"#f59e0b", bg:"rgba(245,158,11,.1)" },
};

// ══════════════════════════════════════════════════════════════════════
//  MICRO HELPERS
// ══════════════════════════════════════════════════════════════════════
function badge(v){ const c=SC[v]||SC.OK; return `<span class="badge" style="color:${c.c};background:${c.bg};border-color:${c.x}33">${v.toUpperCase()}</span>`; }
function pip(h,sz=7){ return `<span style="display:inline-block;width:${sz}px;height:${sz}px;border-radius:50%;background:${HX[h]};box-shadow:0 0 6px ${HX[h]};flex-shrink:0"></span>`; }
function dtag(d){
  if(d===null) return `<span style="color:var(--text3)">—</span>`;
  if(d<0)  return `<span style="color:var(--red);font-weight:700;font-family:var(--font-mono)">${Math.abs(d)}d OVR</span>`;
  if(d<14) return `<span style="color:var(--amber);font-weight:600;font-family:var(--font-mono)">${d}d</span>`;
  return `<span style="color:var(--text3);font-family:var(--font-mono)">${d}d</span>`;
}
function fDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } }
function fSize(b){ if(b<1024) return b+'B'; if(b<1048576) return (b/1024).toFixed(1)+'KB'; return (b/1048576).toFixed(1)+'MB'; }
function docIco(n){ return {pdf:'📄',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊',png:'🖼️',jpg:'🖼️',jpeg:'🖼️',txt:'📋'}[(n.split('.').pop()||'').toLowerCase()]||'📎'; }

// ══════════════════════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════════════════════
function toast(msg, type='ok'){
  const t = document.getElementById('toast');
  const m = { ok:['#00e5a0','#041a0e'], err:['#ef4444','#fff'], warn:['#f59e0b','#1a0c00'] };
  const [bg,fg] = m[type]||m.ok;
  t.textContent=msg; t.style.background=bg; t.style.color=fg;
  t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',3000);
}

// ══════════════════════════════════════════════════════════════════════
//  FILE SYSTEM — Save & Load
// ══════════════════════════════════════════════════════════════════════
async function saveShare(){
  const json = JSON.stringify(DB, null, 2);
  const blob = new Blob([json], { type:'application/json' });
  if(window.showSaveFilePicker){
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'fg_data.json',
        types: [{ description:'JSON Data File', accept:{'application/json':['.json']} }],
      });
      const writable = await handle.createWritable();
      await writable.write(blob); await writable.close();
      toast('✓ Saved to: ' + handle.name); return;
    } catch(e){ if(e.name==='AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'fg_data.json'; a.click();
  toast('✓ fg_data.json downloaded — move it to your shared folder');
}

function loadLatest(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.stations) throw new Error('Invalid format');
        DB = parsed;
        if(!DB.documents)  DB.documents={};
        if(!DB.checklists) DB.checklists={};
        persist(); render(); toast('✓ Loaded: ' + file.name);
      } catch(e){ toast('Invalid file – not fg_data.json','err'); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

//  EXCEL EXPORT
// ══════════════════════════════════════════════════════════════════════
function exportXL(){
  const wb = XLSX.utils.book_new();
  const now = new Date().toLocaleDateString('en-GB');
  const rows = [
    ['OQGN — F&G SYSTEM HEALTH DASHBOARD — FULL REPORT'],['Generated:',now],[],['OVERVIEW'],
    ['Total Stations', DB.stations.length],
    ['Healthy',  DB.stations.filter(s=>hlth(s)==='Healthy').length],
    ['Warning',  DB.stations.filter(s=>hlth(s)==='Warning').length],
    ['Critical', DB.stations.filter(s=>hlth(s)==='Critical').length],
    ['Overdue',  DB.stations.filter(s=>{ const d=dLeft(s.nextTest); return d!==null&&d<0; }).length],
    ['Due ≤14 days', DB.stations.filter(s=>{ const d=dLeft(s.nextTest); return d!==null&&d>=0&&d<=14; }).length],
    [],[`STATION DETAILS`],
    ['Station','Zone','Health','Detector','Battery','Power','Last Test','Next Test','Days','Last Inspection','Notes','Last CL Date','Technician','Fail Items','Inspections','Docs'],
  ];
  DB.stations.forEach(s=>{
    const h=hlth(s), d=dLeft(s.nextTest);
    const cl=DB.checklists[s.id]||[], last=cl.length?cl[cl.length-1]:null;
    rows.push([s.name,s.zone,h,s.det,s.bat,s.pwr,s.lastTest||'',s.nextTest||'',
      d!==null?(d<0?`${Math.abs(d)}d OVERDUE`:`${d}d`):'-',
      s.lastInsp||'',s.notes||'',last?last.date:'-',last?last.techName:'-',
      last?last.failCount:'-',cl.length,(DB.documents[s.id]||[]).length]);
  });
  const ws1=XLSX.utils.aoa_to_sheet(rows);
  ws1['!cols']=[{wch:30},{wch:9},{wch:10},{wch:11},{wch:11},{wch:9},{wch:12},{wch:12},{wch:14},{wch:14},{wch:34},{wch:13},{wch:16},{wch:8},{wch:10},{wch:5}];
  XLSX.utils.book_append_sheet(wb,ws1,'Summary');

  const cl2=[['CHECKLIST HISTORY'],[],['Station','Date','Technician','Category','Pass','Fail','N/A','Note','Failed Items']];
  DB.stations.forEach(s=>(DB.checklists[s.id]||[]).forEach(c=>{
    cl2.push([s.name,c.date,c.techName,'All',c.passCount,c.failCount,c.naCount,c.overallNote||'',
      c.items.filter(x=>x.result==='Fail').map(x=>x.label+(x.issue?` → ${x.issue}`:'')).join(' | ')]);
  }));
  const ws2=XLSX.utils.aoa_to_sheet(cl2); ws2['!cols']=[{wch:28},{wch:12},{wch:18},{wch:20},{wch:6},{wch:6},{wch:6},{wch:32},{wch:80}];
  XLSX.utils.book_append_sheet(wb,ws2,'Checklist History');

  const iss=[['OPEN ISSUES'],[],['Station','Zone','Date','Technician','Category','Item','Issue Detail']];
  DB.stations.forEach(s=>(DB.checklists[s.id]||[]).forEach(c=>c.items.filter(x=>x.result==='Fail').forEach(x=>iss.push([s.name,s.zone,c.date,c.techName,x.cat||'',x.label,x.issue||'']))));
  const ws3=XLSX.utils.aoa_to_sheet(iss); ws3['!cols']=[{wch:28},{wch:9},{wch:12},{wch:18},{wch:22},{wch:35},{wch:50}];
  XLSX.utils.book_append_sheet(wb,ws3,'Open Issues');

  const docs=[['DOCUMENTS'],[],['Station','File','Uploaded By','Date','Size']];
  DB.stations.forEach(s=>(DB.documents[s.id]||[]).forEach(d=>docs.push([s.name,d.name,d.by||'-',d.at||'-',d.size||'-'])));
  const ws4=XLSX.utils.aoa_to_sheet(docs); ws4['!cols']=[{wch:28},{wch:35},{wch:18},{wch:13},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws4,'Documents');

  XLSX.writeFile(wb, `OQGN_FG_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('✓ Excel report downloaded');
}

// ══════════════════════════════════════════════════════════════════════
//  DOCUMENTS
// ══════════════════════════════════════════════════════════════════════
function uploadDoc(sid){
  const inp=document.createElement('input'); inp.type='file';
  inp.accept='.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.txt';
  inp.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    if(file.size>5*1024*1024){ toast('Max 5 MB per file','warn'); return; }
    const reader=new FileReader();
    reader.onload=ev=>{
      const doc={id:Date.now(),name:file.name,size:fSize(file.size),type:file.type,
                 data:ev.target.result,by:S.updater||'Team',at:new Date().toLocaleDateString('en-GB')};
      if(!DB.documents[sid]) DB.documents[sid]=[];
      DB.documents[sid].push(doc);
      persist(); renderModal(); toast('✓ Uploaded: '+file.name);
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}
function deleteDoc(sid,did){
  if(!confirm('Delete this document?')) return;
  DB.documents[sid]=(DB.documents[sid]||[]).filter(d=>d.id!==did);
  persist(); renderModal(); toast('Document deleted');
}
function downloadDoc(sid,did){
  const doc=(DB.documents[sid]||[]).find(d=>d.id===did); if(!doc) return;
  const ext=(doc.name.split('.').pop()||'').toLowerCase();
  const previewable=['pdf','png','jpg','jpeg','gif','bmp','webp','svg'];
  if(previewable.includes(ext)){
    const byteStr=atob(doc.data.split(',')[1]);
    const mime=doc.data.split(',')[0].split(':')[1].split(';')[0];
    const ab=new Uint8Array(byteStr.length);
    for(let i=0;i<byteStr.length;i++) ab[i]=byteStr.charCodeAt(i);
    const blob=new Blob([ab],{type:mime});
    const url=URL.createObjectURL(blob);
    const w=window.open(url,'_blank');
    if(w) w.addEventListener('load',()=>URL.revokeObjectURL(url),{once:true});
    else{ const a=document.createElement('a');a.href=url;a.download=doc.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000); }
  } else {
    const a=document.createElement('a');a.href=doc.data;a.download=doc.name;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }
}

function freshCLItems(){
  return CL_CATEGORIES.flatMap(c => c.items.map(label => ({ label, cat: c.cat, result:'Pass', issue:'' })));
}

function submitCL(sid){
  if(!S.clTech.trim()){ alert('Enter technician name.'); return; }
  const entry={
    id:Date.now(), date:S.clDate, techName:S.clTech.trim(),
    items:S.clItems.map(x=>({...x})), overallNote:S.clNote,
    passCount:S.clItems.filter(x=>x.result==='Pass').length,
    failCount:S.clItems.filter(x=>x.result==='Fail').length,
    naCount:  S.clItems.filter(x=>x.result==='NA').length,
  };
  if(!DB.checklists[sid]) DB.checklists[sid]=[];
  DB.checklists[sid].push(entry);
  const st=DB.stations.find(s=>s.id===sid);
  if(st){ st.lastInsp=entry.date; st.lastTest=entry.date; }
  persist();
  S.clView='history'; S.clTech=''; S.clNote='';
  S.clItems=freshCLItems();
  renderModal(); render(); toast('✓ Inspection logged');
}
function setClR(i,r){ S.clItems[i].result=r; S.clItems[i].issue=''; renderModal(); }
function setClI(i,v){ S.clItems[i].issue=v; }

function saveStation(){
  const n=S.updater.trim()||'Team';
  if(S.editId){
    DB.stations=DB.stations.map(s=>s.id===S.editId?{...s,...S.editData,updatedBy:n}:s);
    S.editId=null; S.editData={};
  } else {
    if(!S.newStn.name.trim()){ alert('Enter station name.'); return; }
    DB.stations.push({...S.newStn,id:Date.now(),updatedBy:n});
    S.addMode=false;
    S.newStn={name:'',zone:'Zone A',det:'OK',bat:'OK',pwr:'OK',lastTest:'',nextTest:'',lastInsp:'',notes:''};
  }
  persist(); render(); toast('✓ Station saved');
}
function startEdit(id){ const s=DB.stations.find(s=>s.id===id); S.editId=id; S.editData={...s}; render(); }
function cancelEdit(){ S.editId=null; S.editData={}; render(); }
function delStation(id){
  if(!confirm('Delete this station?')) return;
  DB.stations=DB.stations.filter(s=>s.id!==id);
  persist(); render(); toast('Station deleted');
}
function openModal(id){ S.modal=DB.stations.find(s=>s.id===id); S.clView='history'; S.clDetail=null; renderModal(); }
function closeModal(){ S.modal=null; document.getElementById('modal-root').innerHTML=''; }
function patchF(w,k,v){ if(w==='new') S.newStn[k]=v; else S.editData[k]=v; }

// ══════════════════════════════════════════════════════════════════════
//  APP STATE
// ══════════════════════════════════════════════════════════════════════
let S = {
  tab:'grid', filterZone:'All', filterH:'All', search:'',
  editId:null, editData:{}, addMode:false, updater:'',
  newStn:{name:'',zone:'Zone A',det:'OK',bat:'OK',pwr:'OK',lastTest:'',nextTest:'',lastInsp:'',notes:''},
  modal:null, clView:'history', clDetail:null,
  clTech:'', clDate:new Date().toISOString().slice(0,10),
  clItems:freshCLItems(),
  clNote:'',
};

// ══════════════════════════════════════════════════════════════════════
//  FORM HTML
// ══════════════════════════════════════════════════════════════════════
function formHTML(data, w){
  const v=k=>data[k]||'';
  const opts=k=>['OK','Fault','Offline','Low'].map(o=>`<option${v(k)===o?' selected':''}>${o}</option>`).join('');
  return `<div class="form-grid">
    <div class="form-full"><div class="form-lbl">Station Name</div><input class="inp" value="${v('name')}" oninput="patchF('${w}','name',this.value)" placeholder="e.g. STN-13 – New Platform"></div>
    <div><div class="form-lbl">Zone</div><input class="inp" value="${v('zone')}" oninput="patchF('${w}','zone',this.value)"></div>
    <div><div class="form-lbl">Last Test Date</div><input type="date" class="inp" value="${v('lastTest')}" onchange="patchF('${w}','lastTest',this.value)"></div>
    <div><div class="form-lbl">Next Test Date</div><input type="date" class="inp" value="${v('nextTest')}" onchange="patchF('${w}','nextTest',this.value)"></div>
    <div><div class="form-lbl">Last Inspection</div><input type="date" class="inp" value="${v('lastInsp')}" onchange="patchF('${w}','lastInsp',this.value)"></div>
    <div><div class="form-lbl">Detector Status</div><select class="inp" onchange="patchF('${w}','det',this.value)">${opts('det')}</select></div>
    <div><div class="form-lbl">Battery Status</div><select class="inp" onchange="patchF('${w}','bat',this.value)">${opts('bat')}</select></div>
    <div><div class="form-lbl">Power Status</div><select class="inp" onchange="patchF('${w}','pwr',this.value)">${opts('pwr')}</select></div>
    <div class="form-full"><div class="form-lbl">Notes</div><textarea class="inp" rows="2" oninput="patchF('${w}','notes',this.value)">${v('notes')}</textarea></div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════════
//  MODAL
// ══════════════════════════════════════════════════════════════════════
function renderModal(){
  const root=document.getElementById('modal-root');
  if(!S.modal){ root.innerHTML=''; return; }
  const s=DB.stations.find(x=>x.id===S.modal.id);
  if(!s){ root.innerHTML=''; return; }
  const hist=(DB.checklists[s.id]||[]).slice().reverse();
  const docs=DB.documents[s.id]||[];
  let body='';

  if(S.clView==='history'){
    const hH = hist.length===0
      ?`<div class="empty"><span class="empty-ico">📭</span><div style="font-size:13px">No inspections yet.</div><div style="font-size:11px;margin-top:6px;color:var(--text3)">Click <strong style="color:var(--green)">+ New Check</strong> to start.</div></div>`
      :hist.map(e=>`<div class="hist-row ${e.failCount>0?'bad':''}" onclick="openCLDetail(${e.id})">
        <div>
          <div style="font-weight:700;color:var(--text);font-size:13px;font-family:var(--font-mono);margin-bottom:2px">${e.date}</div>
          <div style="font-size:11px;color:var(--text3)">By <span style="color:var(--text2)">${e.techName}</span></div>
          ${e.overallNote?`<div style="font-size:10px;color:var(--amber);margin-top:4px">📝 ${e.overallNote}</div>`:''}
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
          <span style="font-size:10px;font-weight:700;font-family:var(--font-mono);color:var(--green);background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.22);border-radius:6px;padding:3px 9px">✓ ${e.passCount}</span>
          ${e.failCount>0?`<span style="font-size:10px;font-weight:700;font-family:var(--font-mono);color:var(--red);background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.22);border-radius:6px;padding:3px 9px">✗ ${e.failCount}</span>`:''}
          ${e.naCount>0?`<span style="font-size:10px;font-family:var(--font-mono);color:var(--text3);background:rgba(74,96,128,.1);border:1px solid rgba(74,96,128,.2);border-radius:6px;padding:3px 9px">— ${e.naCount}</span>`:''}
          <span style="color:var(--text3);font-size:18px;margin-left:2px">›</span>
        </div>
      </div>`).join('');

    const dH=`<div style="margin-top:24px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="sect-lbl" style="margin:0">📎 Documents (${docs.length})</div>
        <button class="btn btn-primary" style="padding:6px 14px;font-size:12px" onclick="uploadDoc(${s.id})">+ Upload File</button>
      </div>
      ${docs.length===0?`<div style="font-size:12px;color:var(--text3);text-align:center;padding:20px;border:1px dashed var(--border);border-radius:var(--radius-sm)">No documents yet. Upload PDFs, photos, test reports as evidence (max 5 MB).</div>`:
        docs.map(d=>`<div class="doc-row">
          <span style="font-size:22px">${docIco(d.name)}</span>
          <div class="doc-info"><div class="doc-name">${d.name}</div><div class="doc-meta">${d.size} · ${d.at} · by ${d.by}</div></div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button class="mbtn mbtn-dl" onclick="downloadDoc(${s.id},${d.id})">👁 Open</button>
            <button class="mbtn mbtn-del" onclick="deleteDoc(${s.id},${d.id})">Del</button>
          </div>
        </div>`).join('')}
    </div>`;
    body=hH+dH;

  } else if(S.clView==='detail' && S.clDetail){
    const e=S.clDetail, fails=e.items.filter(x=>x.result==='Fail');
    // Group items by category for display
    const catMap={};
    e.items.forEach(it=>{
      const cat=it.cat||'General';
      if(!catMap[cat]) catMap[cat]=[];
      catMap[cat].push(it);
    });
    body=`<button onclick="S.clView='history';S.clDetail=null;renderModal()" style="background:none;color:var(--green);border:none;font-size:12px;cursor:pointer;margin-bottom:16px;font-family:var(--font-body);display:flex;align-items:center;gap:5px">← Back to History</button>
      <div style="display:flex;gap:16px;flex-wrap:wrap;background:var(--s2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px">
        ${[['Date',`<span style="font-family:var(--font-mono)">${e.date}</span>`],['Technician',e.techName],
          ['Result',e.failCount>0?`<span style="color:var(--red);font-weight:700">${e.failCount} Issue(s)</span>`:`<span style="color:var(--green);font-weight:700">All Clear ✓</span>`],
          ['Pass / Fail / N/A',`<span style="font-family:var(--font-mono)">${e.passCount} / ${e.failCount} / ${e.naCount}</span>`]]
          .map(([l,v])=>`<div><div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;font-family:var(--font-mono);margin-bottom:4px">${l}</div><div style="font-size:13px;font-weight:600;color:var(--text)">${v}</div></div>`).join('')}
      </div>
      ${fails.length>0?`<div style="background:var(--red-dim);border:1px solid rgba(239,68,68,.2);border-radius:var(--radius);padding:16px;margin-bottom:16px">
        <div style="font-size:12px;font-weight:700;color:var(--red);font-family:var(--font-head);margin-bottom:11px;letter-spacing:.04em">⚠ ISSUES FOUND (${fails.length})</div>
        ${fails.map(x=>`<div style="margin-bottom:9px;padding-left:13px;border-left:2px solid rgba(239,68,68,.4)">
          ${x.cat?`<div style="font-size:9px;color:var(--text3);font-family:var(--font-mono);margin-bottom:2px">${x.cat}</div>`:''}
          <div style="font-size:12px;color:#ffc0c0;font-weight:600">✗ ${x.label}</div>
          ${x.issue?`<div style="font-size:11px;color:var(--red);margin-top:3px;font-family:var(--font-mono)">↳ ${x.issue}</div>`:''}</div>`).join('')}</div>`:''}
      ${Object.entries(catMap).map(([cat,items])=>`
        <div class="cl-cat-hdr">${cat}</div>
        ${items.map(it=>{
          const col=it.result==='Pass'?'var(--green)':it.result==='Fail'?'var(--red)':'var(--text3)';
          const ico=it.result==='Pass'?'✓':it.result==='Fail'?'✗':'—';
          return`<div style="display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)">
            <span style="color:${col};font-weight:700;font-size:14px;min-width:18px;text-align:center;font-family:var(--font-mono)">${ico}</span>
            <div style="flex:1">
              <div style="font-size:12px;color:${it.result==='Fail'?'#ffc0c0':'var(--text)'}">${it.label}</div>
              ${it.issue?`<div style="font-size:11px;color:var(--red);margin-top:3px;font-family:var(--font-mono)">↳ ${it.issue}</div>`:''}
            </div>
            <span style="font-size:10px;color:${col};background:${col}18;border:1px solid ${col}33;border-radius:5px;padding:2px 8px;flex-shrink:0;font-family:var(--font-mono)">${it.result}</span>
          </div>`;
        }).join('')}`).join('')}
      ${e.overallNote?`<div style="margin-top:14px;background:var(--amber-dim);border:1px solid rgba(245,158,11,.2);border-radius:var(--radius-sm);padding:12px;font-size:12px;color:var(--amber)">📝 <strong>Note:</strong> ${e.overallNote}</div>`:''}`;

  } else if(S.clView==='new'){
    // Render checklist grouped by category
    let clIdx=0;
    const catSections = CL_CATEGORIES.map(cat=>{
      const startIdx = clIdx;
      const section = `
        <div class="cl-cat-hdr">${cat.cat} <span style="opacity:.5;font-weight:400">(${cat.items.length} items)</span></div>
        ${cat.items.map((label,j)=>{
          const i=startIdx+j;
          const it=S.clItems[i];
          return `<div class="cl-item ${it&&it.result==='Fail'?'is-fail':''}">
            <div class="cl-item-row">
              <span class="cl-item-lbl">${label}</span>
              <div style="display:flex;gap:5px;flex-shrink:0">
                ${['Pass','Fail','NA'].map(r=>{
                  const a=it&&it.result===r;
                  const rc=r==='Pass'?'#00e5a0':r==='Fail'?'#ef4444':'#4a6080';
                  return`<button class="rbtn" onclick="setClR(${i},'${r}')" style="background:${a?rc:'transparent'};color:${a?'#060810':rc};border-color:${rc}55">${r}</button>`;
                }).join('')}
              </div>
            </div>
            ${it&&it.result==='Fail'?`<input class="inp" style="margin-top:9px;font-size:12px" placeholder="Describe the issue / finding…" value="${(it&&it.issue)||''}" oninput="setClI(${i},this.value)">`:''}
          </div>`;
        }).join('')}`;
      clIdx += cat.items.length;
      return section;
    }).join('');

    body=`<button onclick="S.clView='history';renderModal()" style="background:none;color:var(--green);border:none;font-size:12px;cursor:pointer;margin-bottom:16px;font-family:var(--font-body)">← Cancel</button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
        <div><div class="form-lbl">Technician Name *</div><input class="inp" value="${S.clTech}" oninput="S.clTech=this.value" placeholder="Your full name"></div>
        <div><div class="form-lbl">Inspection Date</div><input type="date" class="inp" value="${S.clDate}" onchange="S.clDate=this.value"></div>
      </div>
      <div style="background:var(--green-dim);border:1px solid rgba(0,229,160,.18);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;font-size:11px;color:var(--green);font-family:var(--font-mono)">
        OQGN F&G Inspection — ${CL_ITEMS.length} items across ${CL_CATEGORIES.length} categories
      </div>
      ${catSections}
      <div style="margin-top:14px"><div class="form-lbl">Overall Notes / Remarks</div>
        <textarea class="inp" rows="3" placeholder="General observations, corrective actions, follow-up required…" oninput="S.clNote=this.value">${S.clNote}</textarea>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-primary" onclick="submitCL(${s.id})">Submit Inspection</button>
        <button class="btn btn-ghost" onclick="S.clView='history';renderModal()">Cancel</button>
      </div>`;
  }

  root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-hdr">
        <div>
          <div class="modal-title">📋 Checklist & Documents</div>
          <div class="modal-sub">${s.name} · ${s.zone}</div>
        </div>
        <div style="display:flex;gap:7px">
          ${S.clView!=='new'?`<button class="btn btn-primary" style="font-size:12px;padding:6px 14px" onclick="S.clView='new';renderModal()">+ New Check</button>`:''}
          <button class="btn btn-ghost" style="font-size:18px;padding:5px 12px" onclick="closeModal()">✕</button>
        </div>
      </div>
      <div class="modal-body">${body}</div>
    </div>
  </div>`;
}

function openCLDetail(id){
  S.clDetail=(DB.checklists[S.modal.id]||[]).find(e=>e.id===id);
  S.clView='detail'; renderModal();
}

// ══════════════════════════════════════════════════════════════════════
//  MAIN RENDER
// ══════════════════════════════════════════════════════════════════════
function render(){
  const dark = isDark();
  const zones=['All',...Array.from(new Set(DB.stations.map(s=>s.zone))).sort()];
  const filtered=DB.stations.filter(s=>{
    const h=hlth(s);
    return (S.filterZone==='All'||s.zone===S.filterZone)
        && (S.filterH==='All'||h===S.filterH)
        && (S.search===''||s.name.toLowerCase().includes(S.search.toLowerCase()));
  });
  const tot=DB.stations.length;
  const sum={
    total:tot,
    healthy: DB.stations.filter(s=>hlth(s)==='Healthy').length,
    warning: DB.stations.filter(s=>hlth(s)==='Warning').length,
    critical:DB.stations.filter(s=>hlth(s)==='Critical').length,
    overdue: DB.stations.filter(s=>{const d=dLeft(s.nextTest);return d!==null&&d<0;}).length,
    soon:    DB.stations.filter(s=>{const d=dLeft(s.nextTest);return d!==null&&d>=0&&d<=14;}).length,
  };

  const kpiDef=[
    {ico:'🏭',lbl:'Total Stations', val:sum.total,   c:'var(--blue)', x:'#60a5fa'},
    {ico:'✅',lbl:'Healthy',         val:sum.healthy, c:'var(--green)',x:'#00e5a0', sub:tot?`${Math.round(sum.healthy/tot*100)}% operational`:''},
    {ico:'⚠️',lbl:'Warning',         val:sum.warning, c:'var(--amber)',x:'#f59e0b'},
    {ico:'🚨',lbl:'Critical',        val:sum.critical,c:'var(--red)',  x:'#ef4444'},
    {ico:'⏰',lbl:'Overdue Tests',   val:sum.overdue, c:'var(--red)',  x:'#ef4444', sub:'Past due date'},
    {ico:'📅',lbl:'Due ≤14 Days',   val:sum.soon,    c:'var(--amber)',x:'#f59e0b'},
  ];
  const kpis=kpiDef.map((k,i)=>`
    <div class="kpi fu" style="animation-delay:${i*45}ms">
      <div class="kpi-top-bar" style="background:${k.c}"></div>
      <div class="kpi-corner" style="background:${k.x}"></div>
      <span class="kpi-icon">${k.ico}</span>
      <div class="kpi-val" style="color:${k.c}">${k.val}</div>
      <div class="kpi-lbl">${k.lbl}</div>
      ${k.sub?`<div class="kpi-sub" style="color:${k.c}">${k.sub}</div>`:''}
    </div>`).join('');

  const cards=filtered.map((s,i)=>{
    const h=hlth(s), hc=HX[h], days=dLeft(s.nextTest);
    const checks=DB.checklists[s.id]||[], last=checks.length?checks[checks.length-1]:null;
    const fails=last?last.items.filter(x=>x.result==='Fail'):[];
    const docs=DB.documents[s.id]||[];
    const hbg=h==='Healthy'?'rgba(0,229,160,.08)':h==='Warning'?'rgba(245,158,11,.08)':'rgba(239,68,68,.08)';
    const hbc=h==='Healthy'?'rgba(0,229,160,.25)':h==='Warning'?'rgba(245,158,11,.25)':'rgba(239,68,68,.25)';

    if(S.editId===s.id) return`<div class="st-card add-card fu" style="animation-delay:${i*14}ms">
      <div style="font-size:11px;font-weight:700;color:var(--green);font-family:var(--font-mono);letter-spacing:.08em;margin-bottom:13px">✏ EDITING STATION</div>
      ${formHTML(S.editData,'edit')}
      <div style="display:flex;gap:8px;margin-top:13px">
        <button class="btn btn-primary" onclick="saveStation()">Save Changes</button>
        <button class="btn btn-ghost" onclick="cancelEdit()">Cancel</button>
      </div></div>`;

    return`<div class="st-card fu" style="border-color:${hc}1a;animation-delay:${i*14}ms">
      <div class="st-accent" style="background:${hc}"></div>
      <div class="st-glow" style="background:linear-gradient(${hc},transparent)"></div>
      <div class="st-header">
        <div style="flex:1;min-width:0;margin-right:8px">
          <div class="st-name">${s.name}</div>
          <div class="st-zone">${s.zone}</div>
        </div>
        <div class="h-chip" style="background:${hbg};color:${hc};border-color:${hbc}">
          <div class="h-pip" style="background:${hc};box-shadow:0 0 5px ${hc}"></div>${h}
        </div>
      </div>
      <div class="trio">
        ${[['Detector',s.det],['Battery',s.bat],['Power',s.pwr]].map(([l,v])=>`
          <div class="trio-cell"><div class="trio-lbl">${l}</div>${badge(v)}</div>`).join('')}
      </div>
      <div class="date-grid">
        <div class="date-item">Last Test<span>${fDate(s.lastTest)}</span></div>
        <div class="date-item">Next Test<span style="color:${days!==null&&days<0?'var(--red)':days!==null&&days<14?'var(--amber)':'var(--text)'}">${fDate(s.nextTest)}</span></div>
      </div>
      ${s.notes?`<div class="note-tag">📝 ${s.notes}</div>`:''}
      <div class="cl-strip">
        <div class="cl-strip-row">
          <div>
            <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;font-family:var(--font-mono);margin-bottom:3px">Last Inspection</div>
            ${last
              ?`<div class="cl-date">${last.date}</div><div class="cl-tech">${last.techName}</div>`
              :`<div style="font-size:11px;color:var(--text3)">No inspection yet</div>`}
          </div>
          <div class="cl-badges">
            ${last&&last.failCount>0?`<span class="cl-badge" style="color:var(--red);background:var(--red-mid);border-color:rgba(239,68,68,.3)">✗ ${last.failCount}</span>`:''}
            ${last&&last.failCount===0?`<span class="cl-badge" style="color:var(--green);background:var(--green-mid);border-color:rgba(0,229,160,.3)">✓ Clear</span>`:''}
            <span style="font-size:10px;color:var(--text3);font-family:var(--font-mono)">${checks.length}×</span>
            ${docs.length>0?`<span style="font-size:10px;color:var(--blue);background:var(--blue-dim);border:1px solid rgba(96,165,250,.22);border-radius:5px;padding:2px 7px;font-family:var(--font-mono)">📎 ${docs.length}</span>`:''}
          </div>
        </div>
        ${fails.length>0?`<div class="issue-pills">
          ${fails.slice(0,3).map(x=>`<span class="issue-pill" title="${x.label}">↳ ${x.label}</span>`).join('')}
          ${fails.length>3?`<span style="font-size:9px;color:var(--text3)">+${fails.length-3} more</span>`:''}
        </div>`:''}
      </div>
      <div class="card-actions">
        <button class="mbtn mbtn-cl" style="flex:1" onclick="openModal(${s.id})">📋 Checklist ${checks.length>0?`(${checks.length})`:''}</button>
        <button class="mbtn mbtn-ed" onclick="startEdit(${s.id})">Edit</button>
        <button class="mbtn mbtn-del" onclick="delStation(${s.id})">Del</button>
      </div>
    </div>`;
  }).join('');

  const tblRows=filtered.map((s,i)=>{
    const h=hlth(s), hc=HX[h], days=dLeft(s.nextTest);
    const checks=DB.checklists[s.id]||[], last=checks.length?checks[checks.length-1]:null;
    const docs=DB.documents[s.id]||[];
    return`<tr>
      <td style="color:var(--text);font-weight:600;font-family:var(--font-head);font-size:13px">${s.name}</td>
      <td style="color:var(--text3);font-family:var(--font-mono);font-size:10px">${s.zone}</td>
      <td><span style="display:inline-flex;align-items:center;gap:5px;color:${hc};font-weight:700;font-size:11px;font-family:var(--font-mono)">${pip(h)} ${h}</span></td>
      <td>${badge(s.det)}</td><td>${badge(s.bat)}</td><td>${badge(s.pwr)}</td>
      <td style="color:${days!==null&&days<0?'var(--red)':days!==null&&days<14?'var(--amber)':'var(--text)'};font-family:var(--font-mono);font-size:11px;white-space:nowrap">${fDate(s.nextTest)}</td>
      <td>${dtag(days)}</td>
      <td style="font-size:11px;color:var(--text3);white-space:nowrap;font-family:var(--font-mono)">${last?`${last.date} · ${last.techName}`:'—'}</td>
      <td>${last?(last.failCount>0?`<span style="color:var(--red);font-weight:700;font-family:var(--font-mono)">✗ ${last.failCount}</span>`:`<span style="color:var(--green);font-weight:700">✓</span>`):'<span style="color:var(--text3)">—</span>'}</td>
      <td style="color:var(--blue);font-size:11px;font-family:var(--font-mono)">${docs.length}</td>
      <td><div style="display:flex;gap:5px">
        <button class="mbtn mbtn-cl" onclick="openModal(${s.id})">📋 ${checks.length||''}</button>
        <button class="mbtn mbtn-ed" onclick="startEdit(${s.id})">Edit</button>
        <button class="mbtn mbtn-del" onclick="delStation(${s.id})">Del</button>
      </div></td>
    </tr>`;
  }).join('');

  document.getElementById('app').innerHTML=`
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">🔥</div>
      <div class="brand-name">
        OQGN F&G SYSTEM HEALTH
        <em>Natural Gas Field — Fire &amp; Gas Monitoring</em>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-theme" onclick="toggleTheme()">
        <span class="theme-light-label">☀️ Light Mode</span>
        <span class="theme-dark-label">🌙 Dark Mode</span>
      </button>
      <button class="btn btn-icon" onclick="exportXL()" title="Export Excel report">📥 Export</button>
      <button class="btn btn-save" onclick="saveShare()">💾 Save &amp; Share</button>
      <button class="btn btn-load" onclick="loadLatest()">↻ Load Latest</button>
      <input class="inp" style="width:148px;font-size:12px" placeholder="Your name…" value="${S.updater}" oninput="S.updater=this.value">
    </div>
  </div>

  <div class="syncbar">
    <div>
      <span class="sync-dot dot-ok"></span>
      Data stored locally · ${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})} · ${DB.stations.length} stations · ${CL_ITEMS.length} checklist items
    </div>
    <div class="syncbar-hint">
      <strong>💾 Save &amp; Share</strong> → choose where to save fg_data.json &nbsp;·&nbsp;
      <strong>↻ Load Latest</strong> → pick fg_data.json to get teammates' changes
    </div>
  </div>

  <div class="main">
    <div class="kpi-row">${kpis}</div>

    <div class="controls">
      <input class="inp" style="width:185px" placeholder="🔍  Search stations…" value="${S.search}" oninput="S.search=this.value;render()">
      <select class="sel" onchange="S.filterZone=this.value;render()">${zones.map(z=>`<option${S.filterZone===z?' selected':''}>${z}</option>`).join('')}</select>
      <select class="sel" onchange="S.filterH=this.value;render()">${['All','Healthy','Warning','Critical'].map(h=>`<option${S.filterH===h?' selected':''}>${h}</option>`).join('')}</select>
      <div class="tab-wrap">
        <button class="tab-btn" onclick="S.tab='grid';render()" style="background:${S.tab==='grid'?'rgba(0,229,160,.1)':'var(--s2)'};color:${S.tab==='grid'?'var(--green)':'var(--text3)'};border-right:1px solid var(--border2)">⊞  Grid</button>
        <button class="tab-btn" onclick="S.tab='table';render()" style="background:${S.tab==='table'?'rgba(0,229,160,.1)':'var(--s2)'};color:${S.tab==='table'?'var(--green)':'var(--text3)'}">☰  Table</button>
      </div>
      <div style="margin-left:auto">
        <button class="btn btn-primary" onclick="S.addMode=!S.addMode;render()">＋ Add Station</button>
      </div>
    </div>

    ${S.addMode?`<div class="add-card fu">
      <div style="font-family:var(--font-head);font-size:16px;font-weight:700;color:var(--green);letter-spacing:.05em;margin-bottom:15px">New Station</div>
      ${formHTML(S.newStn,'new')}
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn btn-primary" onclick="saveStation()">Save Station</button>
        <button class="btn btn-ghost" onclick="S.addMode=false;render()">Cancel</button>
      </div>
    </div>`:''}

    ${S.tab==='grid'?`<div class="st-grid">${cards}${filtered.length===0?`<div class="empty" style="grid-column:1/-1"><span class="empty-ico">🔍</span>No stations match filters.</div>`:''}</div>`:''}

    ${S.tab==='table'?`<div class="tbl-wrap"><table>
      <thead><tr>
        <th>Station</th><th>Zone</th><th>Health</th>
        <th>Detector</th><th>Battery</th><th>Power</th>
        <th>Next Test</th><th>Days</th><th>Last Inspection</th>
        <th>Issues</th><th>Docs</th><th>Actions</th>
      </tr></thead>
      <tbody>${tblRows}${filtered.length===0?`<tr><td colspan="12" style="text-align:center;color:var(--text3);padding:40px">No stations match.</td></tr>`:''}</tbody>
    </table></div>`:''}

    <div class="legend">
      <span style="color:var(--text2);font-weight:600">Legend:</span>
      ${Object.entries(HX).map(([k,c])=>`<span style="display:inline-flex;align-items:center;gap:5px">${pip(k)} ${k}</span>`).join('')}
      <span style="color:var(--border2)">|</span>
      ${['OK','Fault','Offline','Low'].map(k=>badge(k)).join(' ')}
    </div>
  </div>

  <div id="modal-root"></div>`;

  if(S.modal) renderModal();
}

render();
</script>
</body>
</html>
